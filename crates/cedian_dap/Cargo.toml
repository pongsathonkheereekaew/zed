[package]
name = "cedian_dap"
version = "0.1.0"
edition = "2021"

# S1: headless DAP client — spawn lldb-dap over stdio, DAP framing (same
# Content-Length discipline as LSP), breakpoint/stack/variables round-trip.
# Blocking API for a dedicated thread. Agent breakpoints sync here; the native
# debugger UI binds with the fork.

[dependencies]
parking_lot = "0.12"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[features]
test-utils = []


[[test]]
name = "fake_adapter"
required-features = ["test-utils"]

[lints]
workspace = true
