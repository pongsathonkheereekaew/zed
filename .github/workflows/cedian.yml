name: cedian

on:
  push:
    paths: ["crates/cedian_**", "vendor/omp-rpc/**", "vendor/omp-revision.json", "script/cedian-*", "cedian/**", "Cargo.lock"]
  pull_request:
    paths: ["crates/cedian_**", "vendor/omp-rpc/**", "vendor/omp-revision.json", "script/cedian-*", "cedian/**", "Cargo.lock"]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: cedian crates (fmt, clippy, hermetic tests; live lanes never gate)
        run: script/cedian-check
