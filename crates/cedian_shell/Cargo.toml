[package]
name = "cedian_shell"
version = "0.1.0"
edition = "2021"

# Phase 2.5 (headless): app shell models without GPUI — settings TOML,
# palette registry, session manager. GPUI views (onboarding wizard, settings
# UI, update banner) bind with the Zed fork; the data + validation lives here.

[dependencies]
cedian_agent_ui = { path = "../cedian_agent_ui" }
cedian_omp = { path = "../cedian_omp" }
cedian_workflow = { path = "../cedian_workflow" }
sha2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.8"

[lints]
workspace = true
