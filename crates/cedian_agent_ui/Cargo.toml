[package]
name = "cedian_agent_ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# Phase 2: headless UI models — panel/composer/message/tool_card/ask state.
# Pure view-models over cedian_agent; GPUI rendering binds later.
# Batching contract (§73): deltas accumulate in TextDeltaBuffer, flush at
# ~16–33ms; tests drive flush explicitly for determinism.

[dependencies]
cedian_agent = { path = "../cedian_agent" }
cedian_omp = { path = "../cedian_omp" }
omp-rpc = { path = "../../vendor/omp-rpc" }
parking_lot = "0.12"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
