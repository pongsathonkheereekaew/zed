[package]
name = "cedian_workspace"
version = "0.1.0"
edition = "2021"

# Phase 4: editor-native edit surface (headless).
# WorkspaceHost trait + in-memory backend + cedian:// URIs + host tools.
# Zed binding (clock::Global, text::Transaction, History) lands with the fork;
# the trait shape already mirrors plan §12 so the swap is mechanical.

[dependencies]
clock.workspace = true
cedian_omp = { path = "../cedian_omp" }
omp-rpc = { path = "../../vendor/omp-rpc" }
parking_lot = "0.12"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
