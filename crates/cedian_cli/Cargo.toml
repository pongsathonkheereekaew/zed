[package]
name = "cedian_cli"
version = "0.1.0"
edition = "2021"

# Throwaway harness: full agent loop over the headless crates, proving the
# phases compose before GPUI exists. Dies when the Zed fork lands — the wiring
# logic moves into the app shell, this binary does not.

[[bin]]
name = "cedian"
path = "src/main.rs"

[dependencies]
clock.workspace = true
omp-rpc = { path = "../../vendor/omp-rpc" }
cedian_agent = { path = "../cedian_agent" }
cedian_agent_ui = { path = "../cedian_agent_ui" }
cedian_omp = { path = "../cedian_omp" }
cedian_review = { path = "../cedian_review" }
cedian_shell = { path = "../cedian_shell" }
cedian_workspace = { path = "../cedian_workspace" }
cedian_worker = { path = "../cedian_worker" }
cedian_workflow = { path = "../cedian_workflow" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
cedian_fake_omp = { path = "../cedian_fake_omp" }

# Re-execs itself as fake-omp (argv `--mode rpc-ui …`), so it owns `main`.
[[test]]
name = "replay_cli"
harness = false

# CLI stdout IS the product (user reads it): opt out of print_stdout only.
[lints.clippy]
print_stdout = "allow"
